const Store={mode:'local',db:null,uid:null,ready:false,q:Promise.resolve(),
  async init(){
    try{
      if(window.claude&&typeof window.claude.use==='function'){
        const t=new Promise(r=>setTimeout(()=>r(null),10000));
        const db=await Promise.race([window.claude.use('db'),t]);
        const us=db?await Promise.race([window.claude.use('user'),t]):null;
        const id=us?await us.id():null;
        if(db&&id){this.db=db;this.uid=id;this.mode='cloud';}
      }
    }catch(e){}
    this.ready=true;
  },
  localAll(){try{return JSON.parse(localStorage.getItem('pgf_saves')||'{}')||{};}catch(e){return {};}},
  localPut(S){try{const a=this.localAll();a[S.id]=S;localStorage.setItem('pgf_saves',JSON.stringify(a));}catch(e){}},
  localDel(id){try{const a=this.localAll();delete a[id];localStorage.setItem('pgf_saves',JSON.stringify(a));}catch(e){}},
  localDeleted(){try{return JSON.parse(localStorage.getItem('pgf_deleted')||'{}')||{};}catch(e){return {};}},
  async list(){
    const map=this.localAll();
    if(this.mode==='cloud'){
      try{
        const q=await this.db.collection('data/users/'+this.uid).get();
        q.docs.forEach(d=>{if(!d.id.startsWith('save_'))return;try{const s=JSON.parse(d.data().json);if(!map[s.id]||(s.upd||0)>(map[s.id].upd||0))map[s.id]=s;}catch(e){}});
      }catch(e){}
    }
    const del=this.localDeleted();Object.keys(map).forEach(k=>{if(del[k])delete map[k];});
    return Object.values(map).map(migrate).sort((a,b)=>(b.upd||0)-(a.upd||0));
  },
  put(S){
    S.upd=Date.now();this.localPut(S);
    if(this.mode==='cloud'){const json=JSON.stringify(S);const ref=this.db.collection('data/users/'+this.uid).doc('save_'+S.id);
      this.q=this.q.then(()=>ref.set({json,upd:S.upd})).catch(()=>{});}
  },
  del(id){
    this.localDel(id);
    try{const d=this.localDeleted();d[id]=1;localStorage.setItem('pgf_deleted',JSON.stringify(d));}catch(e){}
    if(this.mode==='cloud'){const ref=this.db.collection('data/users/'+this.uid).doc('save_'+id);this.q=this.q.then(()=>ref.delete()).catch(()=>{});}
  }
};

function genPlayer(pos,ovr,y){

function slots(S){
  const used=new Set(),best=pos=>{const c=S.roster.filter(p=>p.p===pos&&!used.has(p.id)).sort((a,b)=>ovrOf(b)-ovrOf(a))[0];if(c)used.add(c.id);return c||null;};

function roundRobin(ids){
  const t=ids.slice();if(t.length%2)t.push(-1);const n=t.length,rounds=[];
  for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a>=0&&b>=0)pr.push([a,b]);}rounds.push(pr);t.splice(1,0,t.pop());}
  return shuffle(rounds);
}

function schedLocked(S){return S.phase!=='regular'||S.week>0||userGames(S).some(x=>x.g[2]!=null);}
function isConfGame(a,b){const c=TEAMS[a].conf;return c!=='IND'&&c===TEAMS[b].conf;}
function oppEligible(S,wk){const ut=S.ut,mine=new Set();S.sched.forEach(w=>w.forEach(g=>{if(g[0]===ut)mine.add(g[1]);if(g[1]===ut)mine.add(g[0]);}));
  return TEAMS.map((t,i)=>i).filter(i=>{if(i===ut||mine.has(i))return false;const g2=S.sched[wk].find(g=>g[0]===i||g[1]===i);if(!g2)return true;const o2=g2[0]===i?g2[1]:g2[0];return !isConfGame(i,o2);});}
function swapOpp(S,wk,x){if(schedLocked(S))return false;const ut=S.ut,g=S.sched[wk].find(g=>g[0]===ut||g[1]===ut);if(!g)return false;const o=g[0]===ut?g[1]:g[0];if(isConfGame(ut,o)||!oppEligible(S,wk).includes(x))return false;
  const g2=S.sched[wk].find(q=>q[0]===x||q[1]===x);if(g2){const k=g2[0]===x?0:1;g2[k]=o;}g[g[0]===ut?1:0]=x;return true;}

    while(pick4.length<NP&&pool.length){let tot=pool.reduce((a,x)=>a+x.w,0),r=Math.random()*tot;let k=0;for(;k<pool.length;k++){r-=pool[k].w;if(r<=0)break;}k=Math.min(k,pool.length-1);pick4.push(pool[k].p.id);pool.splice(k,1);}

function playDiagram(pl){

  g.fillStyle='#2a8434';g.fillRect(0,0,118,78);g.fillStyle='#2f8f3a';for(let i=0;i<118;i+=24)g.fillRect(i,0,12,78);

  const dot=(x,y,c)=>{g.fillStyle='#000';g.fillRect(Math.round(x)-4,Math.round(y)-4,8,8);g.fillStyle=c;g.fillRect(Math.round(x)-3,Math.round(y)-3,6,6);};
  const pos={WR1:[-0.9,-15,-1],WR2:[-0.9,15,1],TE:[-1.2,5,1],RB:[-4.5,-1.8,1]};
  g.lineWidth=2;
  if(pl.type==='pass'){
    ['WR1','WR2','TE','RB'].forEach((k,i)=>{const [px,py,sd]=pos[k];g.strokeStyle=k==='RB'?'#9fe6ff':'#ffd93b';g.beginPath();g.moveTo(xx(px),yy(py));
      pl.r[i].forEach(p=>g.lineTo(k==='RB'?xx(px+p[0]):xx(p[0]),yy(py+p[1]*sd)));g.stroke();});
    if(pl.pa){g.strokeStyle='#ff6b6b';g.setLineDash([3,3]);g.beginPath();g.moveTo(xx(-4.5),yy(-1.8));g.lineTo(xx(-1),yy(0));g.stroke();g.setLineDash([]);}
  }else{
    const sd=pl.side==='away'?-1:1,ly=pl.lane*sd,sx0=pl.car==='qb'?-4.5:-4.5,sy0=pl.car==='qb'?0:-1.8;
    g.strokeStyle=pl.car==='qb'?'#ffb347':'#ff6b6b';g.lineWidth=3;g.beginPath();g.moveTo(xx(sx0),yy(sy0));if(pl.drop)g.lineTo(xx(-6),yy(sy0));g.lineTo(xx(1),yy(ly));g.lineTo(xx(14),yy(ly));g.stroke();
    if(pl.fake){g.strokeStyle='#9fe6ff';g.lineWidth=2;g.setLineDash([3,3]);g.beginPath();g.moveTo(xx(-4.5),yy(-1.8));g.lineTo(xx(2),yy(0));g.stroke();g.setLineDash([]);}
  }
  [-2.2,0,2.2].forEach(d=>dot(xx(-0.9),yy(d),'#cfcfcf'));dot(xx(pl.under?-1.6:-4.5),yy(0),pl.car==='qb'?'#ffb347':'#fff');
  Object.values(pos).forEach(([px,py])=>dot(xx(px),yy(py),'#fff'));
  return DCACHE[pl.id]=c.toDataURL();
}
